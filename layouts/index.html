{{ define "main" }}
  <ul class="post-list">
    {{ range (where site.RegularPages "Section" "posts") }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Params.summary }}<p class="summary">{{ . }}</p>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
