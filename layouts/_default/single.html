{{ define "main" }}
  <article class="post">
    <h1>{{ .Title }}</h1>
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    {{ with .Params.tags }}<div class="tags">{{ range . }}<span class="tag">#{{ . }}</span> {{ end }}</div>{{ end }}
    <div class="content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
